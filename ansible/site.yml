# Converge the whole lab: bare kickstarted nodes -> HA kubeadm cluster.
- name: Prepare all nodes
  hosts: all
  become: true
  roles:
    - common
    - containerd
    - kubeadm-install

- name: Bootstrap HA control plane
  hosts: control_plane
  become: true
  roles:
    - control-plane

- name: Join workers
  hosts: workers
  become: true
  roles:
    - worker
