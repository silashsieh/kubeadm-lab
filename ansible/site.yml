# Converge the whole lab: bare kickstarted nodes -> HA kubeadm cluster.
- name: Prepare all nodes
  hosts: all
  become: true
  roles:
    - common
    - tb-network
    - containerd
    - kubeadm-install

# kubeadm reset stops kubelet and kills containers outright, so kube-vip
# on the old leader never releases the VIP: the address survives on its
# NIC and ARP-fights the next cluster's kube-vip (API calls to the VIP
# get connection-refused at random, mid-converge). A separate play, not
# part of the serial bootstrap below: the stale holder may be cp3 while
# cp1 is the one initializing against the VIP.
- name: Scrub stale kube-vip VIPs left by kubeadm reset
  hosts: control_plane
  become: true
  tasks:
    - name: Check whether this node is part of a cluster
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: scrub_kubelet_conf

    # No kubelet.conf means this node cannot be a legitimate VIP holder.
    - name: Remove stale VIP from the node interface
      ansible.builtin.shell: |
        if ip -4 addr show | grep -qF "inet {{ kube_vip_address }}/"; then
          ip addr del {{ kube_vip_address }}/32 dev {{ kube_vip_interface | default(ansible_facts['default_ipv4']['interface']) }}
          echo removed
        fi
      register: stale_vip
      changed_when: "'removed' in stale_vip.stdout"
      when: not scrub_kubelet_conf.stat.exists

- name: Bootstrap HA control plane
  hosts: control_plane
  become: true
  # One CP node runs the whole role before the next starts. Load-bearing:
  # every `upload-certs` re-encrypts the kubeadm-certs secret with a new
  # key, so a join must follow ITS OWN upload with no other in between —
  # and concurrent joins would also race etcd member addition.
  serial: 1
  roles:
    - control-plane

- name: Join workers
  hosts: workers
  become: true
  roles:
    - worker

# Addons live after bootstrap: unlike the CNI (which the control-plane role
# installs because a cluster without it is broken mid-bootstrap), the
# cluster is fully functional without them.
- name: Install cluster addons
  hosts: control_plane[0]
  become: true
  roles:
    - metallb
