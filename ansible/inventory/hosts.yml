# Node identity lives HERE (and in the DHCP server's MAC reservations),
# never in the kickstart or the installer image.
# TODO: replace placeholder IPs once DHCP reservations are configured;
# record the matching MACs in docs/network.md.
all:
  children:
    control_plane:
      hosts:
        k8s-cp1: { ansible_host: 192.168.1.61 }
        k8s-cp2: { ansible_host: 192.168.1.62 }
        k8s-cp3: { ansible_host: 192.168.1.63 }
    workers:
      hosts:
        k8s-w1: { ansible_host: 192.168.1.64 }
        k8s-w2: { ansible_host: 192.168.1.65 }
