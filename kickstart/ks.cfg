# kubeadm-lab — generic node kickstart, identical for all five nodes.
# Identity-free by design: IP comes from a DHCP MAC reservation, hostname is
# assigned later by Ansible from the inventory. Nothing K8s-related happens
# here — the kickstart's only job is to produce an Ansible-reachable node.
#
# The pubkey placeholder in the sshkey line is substituted by
# build-oemdrv.sh at build time, so no key material lives in the repo.

text --non-interactive
lang en_US.UTF-8
keyboard us
timezone Asia/Taipei --utc

# DHCP only; the DHCP server pins the address by MAC
network --bootproto=dhcp --activate

# Single plain layout, no separate /home (K8s nodes don't need one)
zerombr
clearpart --all --initlabel
autopart --type=plain --nohome

# Key-only access via the ansible user; root and console login stay locked.
# If networking itself breaks, rescue-boot the installer ISO from UTM.
rootpw --lock
user --name=silas --groups=wheel --gecos="Silas Hsieh"
sshkey --username=silas "@SSH_PUBKEY@"

%packages
@^server-product-environment
python3
# Ansible's dnf module needs the dnf5 python bindings on Fedora 41+
python3-libdnf5
%end

%post
# Passwordless sudo so Ansible can become root without a vault'd password
echo 'silas ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/ansible
chmod 440 /etc/sudoers.d/ansible
%end

reboot
